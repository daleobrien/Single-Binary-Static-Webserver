[package]
name = "app"
version = "1.0.0"
description = "A minimal Rust web server serving embedded static files with security headers"
edition = "2021"
license = "MIT"

[features]
default = []
http3 = ["dep:quinn", "dep:h3", "dep:h3-quinn"]

[dependencies]
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "http2"] }
quinn = { version = "0.11", default-features = false, features = ["ring", "runtime-tokio", "rustls-ring"], optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
socket2 = { version = "0.5", features = ["all"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[build-dependencies]
minify-html = "0.18"
css-minify = "0.5"
minify-js = "0.6"
flate2 = "1"
brotli = "7"
rcgen = "0.13"
rustls-pemfile = "2"
sha2 = "0.11"
base64 = "0.22"
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
sha2 = "0.11"
base64 = "0.22"
flate2 = "1"
brotli = "7"
zstd = { version = "0.13", default-features = false }
minify-html = "0.18"
css-minify = "0.5"
minify-js = "0.6"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
dhat = "0.3"

[[bench]]
name = "handler_bench"
harness = false

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
