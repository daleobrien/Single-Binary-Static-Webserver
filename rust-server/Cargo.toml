[package]
name = "app"
version = "1.0.0"
description = "A minimal Rust web server serving embedded static files with security headers"
edition = "2021"
license = "MIT"

[dependencies]
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "http2"] }
quinn = { version = "0.11", default-features = false, features = ["ring", "runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
socket2 = { version = "0.5", features = ["all"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[build-dependencies]
minify-html = "0.18"
css-minify = "0.5"
minify-js = "0.6"
flate2 = "1"
rcgen = "0.13"
rustls-pemfile = "2"
sha2 = "0.11"
base64 = "0.22"

[dev-dependencies]
sha2 = "0.11"
base64 = "0.22"
flate2 = "1"
minify-html = "0.18"
css-minify = "0.5"
minify-js = "0.6"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
